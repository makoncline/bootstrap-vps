name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tomlkit
      - run: ./tests/run.sh
      - run: python3 tests/test_ssh.py
      - run: python3 tests/test_proxy.py
      - run: python3 tests/test_journal.py
